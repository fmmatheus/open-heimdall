name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Build and run bounded test suite
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_dir="${RUNNER_TEMP}/baseline-diagnostics"
          mkdir -p "$diagnostic_dir"
          npm run build 2>&1 | tee "$diagnostic_dir/build.log"
          (
            timeout --signal=TERM --kill-after=15s 10m node --test --test-timeout=180000 test/*.test.mjs 2>&1 | tee "$diagnostic_dir/tests.log"
          ) &
          test_pid=$!
          (
            sleep 240 &
            delay_pid=$!
            trap 'kill "$delay_pid" 2>/dev/null || true; wait "$delay_pid" 2>/dev/null || true' EXIT
            trap 'exit 0' TERM INT
            wait "$delay_pid"
            if kill -0 "$test_pid" 2>/dev/null; then
              ps -eo pid,ppid,etimes,stat,wchan:32,args --forest | tee "$diagnostic_dir/processes.log"
            fi
          ) &
          watcher_pid=$!
          cleanup() {
            kill "$watcher_pid" 2>/dev/null || true
            wait "$watcher_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          test_status=0
          wait "$test_pid" || test_status=$?
          exit "$test_status"
      - run: npm run build:extension
      - name: Upload baseline diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baseline-diagnostics/
          if-no-files-found: warn
          retention-days: 7
  macos-harness:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test test/live-harness.test.mjs
  installed-package:
    name: installed-package (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The declared minimum and a maintained LTS line. Each runs with the npm bundled with that Node.
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: |
          node -v
          npm -v
      - run: npm ci --ignore-scripts
      - run: npm run test:package
      - run: node --test --test-concurrency=1 test/setup-*.test.mjs test/doctor*.test.mjs test/runtime-identity*.test.mjs
  # Real launchd / systemd user-manager lifecycle checks. The suite itself reports every case as skipped unless
  # HEIMDALL_NATIVE_LIFECYCLE=1, and a skip is not a pass, so the variable is exported only after the provisioning
  # step below has proven that the runner provides a usable user manager. If it does not, the job fails: native
  # verification for that platform stays pending rather than passing silently. Neither step enables linger,
  # creates users or changes persistent host settings.
  native-lifecycle:
    name: native-lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prove a usable launchd user domain
        if: runner.os == 'macOS'
        run: |
          set -eu
          uid="$(id -u)"
          sw_vers
          if ! launchctl print "gui/${uid}" > /dev/null 2>&1; then
            echo "::error::No launchd GUI domain is available for uid ${uid}; native launchd verification is pending on this runner."
            exit 1
          fi
          echo "launchd domain gui/${uid} is available"
          echo "HEIMDALL_NATIVE_LIFECYCLE=1" >> "$GITHUB_ENV"
      - name: Prove a usable systemd user manager and bus
        if: runner.os == 'Linux'
        run: |
          set -eu
          uid="$(id -u)"
          usable() {
            [ -n "${XDG_RUNTIME_DIR:-}" ] || return 1
            [ -n "${DBUS_SESSION_BUS_ADDRESS:-}" ] || [ -S "${XDG_RUNTIME_DIR}/bus" ] || return 1
            systemctl --user show-environment > /dev/null 2>&1
          }
          if ! usable; then
            # Start the per-user manager for this uid for the lifetime of the job. This does not enable linger,
            # create users or change any persistent setting; a runner that cannot do this fails below.
            export XDG_RUNTIME_DIR="/run/user/${uid}"
            sudo -n systemctl start "user@${uid}.service" || true
          fi
          if [ -z "${DBUS_SESSION_BUS_ADDRESS:-}" ]; then export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"; fi
          if ! usable; then
            echo "::error::No systemd user manager and user bus are usable for uid ${uid} (XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-unset}); native systemd verification is pending on this runner."
            exit 1
          fi
          systemctl --version | head -n 1
          systemctl --user show-environment | grep -c '=' | sed 's/^/user manager answered; environment entries: /'
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}" >> "$GITHUB_ENV"
          echo "HEIMDALL_NATIVE_LIFECYCLE=1" >> "$GITHUB_ENV"
      - name: Native lifecycle integration suite
        run: |
          test "${HEIMDALL_NATIVE_LIFECYCLE:-}" = "1" || { echo "::error::Native provisioning did not complete; the suite is not run"; exit 1; }
          npm run test:native
